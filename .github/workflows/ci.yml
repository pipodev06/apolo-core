name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# El CI solo lee el repo (lint y build): el token no necesita más.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build

      # Cloud Functions: proyecto aparte (npm), se compila por separado.
      - run: npm ci
        working-directory: functions
      - run: npm run build
        working-directory: functions
